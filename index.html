<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Gold App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; font-family: Arial, sans-serif; padding-top: 50px;">

    <h2>تطبيق Honey Gold</h2>
    <p>اضغط الزر أدناه لتفعيل المحفظة (Testnet)</p>

    <button id="pay_button" style="background-color: #8A2BE2; color: white; padding: 15px 30px; border: none; border-radius: 10px; font-size: 18px; cursor: pointer;">
        Activate & Pay 0.1 Pi
    </button>

    <p id="status" style="margin-top: 20px; color: blue;"></p>

    <script>
        // 3. تفعيل الـ SDK فور تحميل الصفحة
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: true });

        // 4. دالة الدفع التي ستفتح المحفظة
        async function transferPi() {
            try {
                const statusDiv = document.getElementById('status');
                statusDiv.innerText = "جاري الاتصال بالمحفظة...";

                const payment = await Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق Honey Gold",
                    metadata: { appId: "honey" }
                }, {
                    onReadyForServerApproval: (paymentId) => {
                        statusDiv.innerText = "تم إنشاء الدفع، بانتظار الموافقة...";
                        console.log("Payment ID:", paymentId);
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        statusDiv.innerText = "مبروك! اكتمل الدفع بنجاح.";
                        alert("تم الدفع بنجاح! الخطوة 10 أصبحت خضراء.");
                    },
                    onCancel: (paymentId) => {
                        statusDiv.innerText = "تم إلغاء العملية.";
                    },
                    onError: (error, payment) => {
                        statusDiv.innerText = "خطأ: " + error.message;
                        console.error(error);
                    }
                });
            } catch (err) {
                alert("حدث خطأ في الـ SDK: " + err.message);
            }
        }

        // 5. ربط الزر بالدالة
        document.getElementById('pay_button').addEventListener('click', transferPi);
    </script>

</body>
</html>
