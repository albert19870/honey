<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body>
    <div style="text-align: center; margin-top: 50px;">
        <h1>Honey App Mainnet</h1>
        <button id="main-button" style="padding: 15px 30px; background-color: purple; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer;">
            Activate & Pay 0.1 Pi
        </button>
    </div>

    <script>
        const Pi = window.Pi;
        // تعديل للماينت: sandbox: false
        Pi.init({ version: "2.0", sandbox: false });

        document.getElementById('main-button').addEventListener('click', function() {
            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "Final Test for Honey App",
                    metadata: { orderId: 12345 },
                }, {
                    onReadyForServerApproval: function(paymentId) { console.log("Payment Ready:", paymentId); },
                    onReadyForServerCompletion: function(paymentId, txid) { alert("تم الدفع بنجاح!"); },
                    onCancel: function(paymentId) { console.log("Cancelled"); },
                    onError: function(error, payment) { console.error(error); },
                });
            }).catch(function(error) {
                alert("يرجى المحاولة من داخل متصفح Pi");
            });
        });
    </script>
</body>
</html>
