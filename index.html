<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://sdk.minepi.com/pi-ads.js"></script>
</head>
<body style="text-align: center; padding-top: 50px; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f4f9;">

    <div style="background: white; padding: 30px; border-radius: 15px; display: inline-block; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
        <h1 style="color: #673ab7; margin-bottom: 10px;">🍯 تطبيق Honey</h1>
        <p style="color: #555;">منصة تجارة العسل لمجتمع Pi</p>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        
        <button id="btn-pay" style="padding: 15px 30px; background: #673ab7; color: white; border-radius: 30px; border: none; font-size: 18px; cursor: pointer; font-weight: bold; transition: 0.3s;">
            إتمام الخطوة 10 (دفع 0.1 Pi)
        </button>

        <p id="msg" style="margin-top: 20px; color: #673ab7; font-weight: bold;"></p>
    </div>

    <script>
        const Pi = window.Pi;
        
        // تشغيل التطبيق على شبكة الماينت (Mainnet)
        Pi.init({ version: "2.0", sandbox: false });

        // تهيئة نظام الإعلانات لتخطي الخطوة رقم 3 في الـ Checklist
        try {
            Pi.Ads.init({
                onAdLoaded: (ad) => { console.log("Ad loaded"); },
                onAdError: (error) => { console.error("Ad error", error); }
            });
        } catch (e) {
            console.log("Ads SDK loading...");
        }

        document.getElementById('btn-pay').onclick = function() {
            const msgElement = document.getElementById('msg');
            msgElement.innerText = "جاري فتح محفظة Pi...";

            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق Honey الرسمي",
                    metadata: { 
                        orderId: "Honey_Mainnet_" + Date.now(),
                        // مفتاح الـ API الخاص بك الذي يبدأ بـ h7jx
                        apiKey: "h7jxroqoyscyfjacetpemcw5yguizcifmamzev1rlweumgxeb4en9rzhuyxihuuq" 
                    },
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        msgElement.innerText = "تم إنشاء الطلب.. بانتظار موافقتك من المحفظة";
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        msgElement.style.color = "green";
                        msgElement.innerText = "مبروك! تم الدفع بنجاح وتفعيل الخطوة 10.";
                        alert("نجحت المعاملة! يمكنك الآن العودة لإكمال الخطوات.");
                    },
                    onCancel: function(paymentId) {
                        msgElement.innerText = "تم إلغاء عملية الدفع.";
                    },
                    onError: function(error, payment) {
                        msgElement.style.color = "red";
                        msgElement.innerText = "خطأ: " + error.message;
                    }
                });
            }).catch(function(error) {
                msgElement.innerText = "خطأ في تسجيل الدخول: " + error.message;
            });
        };
    </script>
</body>
</html>
