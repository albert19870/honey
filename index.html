<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; padding-top: 100px; font-family: sans-serif;">
    <h1>تطبيق Honey جاهز</h1>
    <button id="pay-button" style="padding: 20px; background: #673ab7; color: white; border-radius: 10px; border: none; font-size: 20px;">
        تأكيد عملية الدفع (0.1 Pi)
    </button>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: false });

        document.getElementById('pay-button').onclick = function() {
            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "Honey App Final Test",
                    metadata: { orderId: "Order_" + Math.floor(Math.random() * 1000000) }
                }, {
                    onReadyForServerApproval: function(id) { console.log(id); },
                    onReadyForServerCompletion: function(id, tx) { alert("نجحت العملية!"); location.reload(); },
                    onCancel: function(id) { },
                    onError: function(err, pay) { alert("خطأ: " + err.message); }
                });
            });
        };
    </script>
</body>
</html>
