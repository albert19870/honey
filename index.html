<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Gold App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px; background-color: #f0f2f5;">

    <h1 style="color: #4a148c;">تطبيق Honey Gold</h1>
    <p>بوابة تأكيد المعاملات الرسمية - الخطوة العاشرة</p>

    <button id="pay_button" style="background-color: #8A2BE2; color: white; padding: 20px 40px; border: none; border-radius: 15px; font-size: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        تأكيد المعاملة وإكمال الخطوة 10 (0.1 Pi)
    </button>

    <div id="status" style="margin-top: 30px; font-size: 18px; color: #333; font-weight: bold;">بوابة الدفع جاهزة...</div>

    <script>
        const Pi = window.Pi;
        // تعديل جوهري: إلغاء الـ sandbox ليتوافق مع الـ Mainnet الخاص بالتطبيق
        Pi.init({ version: "2.0", sandbox: false });

        async function startProcess() {
            const statusDiv = document.getElementById('status');
            statusDiv.style.color = "#333";
            statusDiv.innerText = "جاري المصادقة مع الشبكة...";

            try {
                const scopes = ['payments'];
                const auth = await Pi.authenticate(scopes, function onIncompletePaymentFound(payment) {
                    console.log("دفعة معلقة:", payment.identifier);
                });

                statusDiv.innerText = "تمت المصادقة! جاري إنشاء معاملة بقيمة 0.1 Pi...";

                const payment = await Pi.createPayment({
                    amount: 0.1,
                    memo: "تأكيد تشغيل تطبيق Honey - الخطوة 10",
                    metadata: { appId: "honey" }
                }, {
                    onReadyForServerApproval: (paymentId) => {
                        statusDiv.style.color = "blue";
                        statusDiv.innerText = "المحفظة جاهزة.. يرجى تأكيد الدفع في نافذة Pi المفتوحة الآن!";
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        statusDiv.style.color = "green";
                        statusDiv.innerHTML = "<b>🎉 مبروك! تمت العملية بنجاح تام.</b><br>رقم المعاملة: " + txid;
                        alert("تمت المعاملة بنجاح! ارجع الآن إلى الـ Checklist لتجد الخطوة 10 مكتملة.");
                    },
                    onCancel: (paymentId) => {
                        statusDiv.style.color = "orange";
                        statusDiv.innerText = "تم إلغاء الدفع.";
                    },
                    onError: (error, payment) => {
                        statusDiv.style.color = "red";
                        statusDiv.innerText = "فشلت المعاملة: " + error.message;
                    }
                });

            } catch (err) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "خطأ: " + err.message;
            }
        }

        document.getElementById('pay_button').onclick = startProcess;
    </script>

</body>
</html>
