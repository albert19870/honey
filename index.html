<!DOCTYPE html>
<html>
<head>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
</head>
<body style="padding-top: 50px; font-family: Arial; text-align: center;">
    <h1 style="color: #673ab7;">تطبيق HoneyGold</h1>
    <p>بانتظار إتمام 10 عمليات دفع لتفعيل الماينت</p>
    
    <button id="btn-pay" style="padding: 20px; background: #673ab7; color: white; border-radius: 10px; font-size: 20px; cursor: pointer;">
        دفع 0.1 Pi (تيست نت)
    </button>

    <p id="msg" style="margin-top: 20px; font-weight: bold;"></p>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "1.5", sandbox: true });

        document.getElementById('btn-pay').onclick = function() {
            const msg = document.getElementById('msg');
            msg.innerText = "جاري الاتصال بالمحفظة...";

            Pi.createPayment({
                amount: 0.1,
                memo: "تجربة دفع HoneyGold",
                metadata: { orderId: "123" }
            }, {
                onReadyForServerApproval: function(paymentId) {
                    return axios.post('https://api.minepi.com/v2/payments/' + paymentId + '/approve', {}, {
                        headers: { 'Authorization': 'Key c2rrejfnw3ycty3qhna6uzwgaefgfm1qhgxpzrigdl2iifremmochsavib0aucv4' }
                    });
                },
                onReadyForServerCompletion: function(paymentId, txid) {
                    msg.innerText = "تم الدفع بنجاح!";
                    return axios.post('https://api.minepi.com/v2/payments/' + paymentId + '/complete', { txid }, {
                        headers: { 'Authorization': 'Key c2rrejfnw3ycty3qhna6uzwgaefgfm1qhgxpzrigdl2iifremmochsavib0aucv4' }
                    });
                },
                onCancel: function(paymentId) { msg.innerText = "تم إلغاء العملية."; },
                onError: function(error, payment) { msg.innerText = "خطأ: " + error.message; }
            });
        };
    </script>
</body>
</html>
