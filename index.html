<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey Gold App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; font-family: sans-serif; padding-top: 50px; background-color: #f0f2f5;">

    <h1 style="color: #4a148c;">تطبيق Honey Gold</h1>
    <p>تفعيل الخطوة العاشرة - شبكة الاختبار</p>

    <button id="pay_button" style="background-color: #8A2BE2; color: white; padding: 20px 40px; border: none; border-radius: 15px; font-size: 20px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
        Activate & Pay 0.1 Pi
    </button>

    <div id="status" style="margin-top: 30px; font-size: 18px; color: #333;"></div>

    <script>
        const Pi = window.Pi;
        // ملاحظة: للتست نت نستخدم sandbox: true
        Pi.init({ version: "2.0", sandbox: true });

        async function startProcess() {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = "جاري المصادقة...";

            try {
                // 1. تسجيل الدخول وطلب صلاحية الدفع
                const scopes = ['payments'];
                function onIncompletePaymentFound(payment) {
                    console.log("هناك دفعة معلقة:", payment.identifier);
                };

                const auth = await Pi.authenticate(scopes, onIncompletePaymentFound);
                statusDiv.innerText = "تم تسجيل الدخول بنجاح! جاري طلب الدفع...";

                // 2. إنشاء الدفع
                const payment = await Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق Honey Gold - Testnet",
                    metadata: { appId: "honey" }
                }, {
                    onReadyForServerApproval: (paymentId) => {
                        // هنا الحل: نخبر الواجهة أن الطلب جاهز للموافقة
                        statusDiv.style.color = "blue";
                        statusDiv.innerText = "المحفظة جاهزة.. أكمل الدفع في هاتفك فوراً!";
                        console.log("Payment ID to approve:", paymentId);
                    },
                    onReadyForServerCompletion: (paymentId, txid) => {
                        statusDiv.style.color = "green";
                        statusDiv.innerHTML = "<b>مبروك! تمت العملية بنجاح.</b><br>رقم المعاملة: " + txid;
                        alert("نجاح! الآن اذهب للـ Checklist وستجد الخطوة 10 خضراء.");
                    },
                    onCancel: (paymentId) => {
                        statusDiv.style.color = "orange";
                        statusDiv.innerText = "تم إلغاء الدفع.";
                    },
                    onError: (error, payment) => {
                        statusDiv.style.color = "red";
                        statusDiv.innerText = "خطأ: " + error.message;
                    }
                });

            } catch (err) {
                statusDiv.style.color = "red";
                statusDiv.innerText = "خطأ تقني: " + err.message;
            }
        }

        // ربط الزر بالعملية
        document.getElementById('pay_button').onclick = startProcess;
    </script>

</body>
</html>
