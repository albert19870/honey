<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey.pi App</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: Arial, sans-serif; text-align: center; background-color: #f8f9fa; padding-top: 50px;">

    <div style="background: white; display: inline-block; padding: 30px; border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
        <h1 style="color: #673ab7;">تطبيق Honey.pi</h1>
        <p>مبروك الفوز بالدومين! اضغط أدناه لإتمام الخطوة 10</p>
        
        <button id="pay-button" style="background-color: #673ab7; color: white; border: none; padding: 20px 40px; border-radius: 12px; font-size: 20px; cursor: pointer; font-weight: bold;">
            تأكيد تفعيل التطبيق (0.1 Pi)
        </button>
        
        <p id="status" style="margin-top: 20px; color: #555;"></p>
    </div>

    <script>
        const Pi = window.Pi;
        Pi.init({ version: "2.0", sandbox: false });

        document.getElementById('pay-button').onclick = function() {
            const status = document.getElementById('status');
            status.innerText = "جاري الاتصال بالمحفظة...";

            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل نطاق honey.pi النهائي",
                    metadata: { orderId: "Honey_Final_" + Date.now() },
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        status.innerText = "ينتظر الموافقة.. وافق من المحفظة الآن!";
                        console.log("PaymentID:", paymentId);
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        status.innerText = "تم بنجاح! رقم المعاملة: " + txid;
                        alert("مبروك! تم تفعيل الخطوة 10 بنجاح.");
                    },
                    onCancel: function(paymentId) {
                        status.innerText = "تم إلغاء العملية.";
                    },
                    onError: function(error, payment) {
                        status.innerText = "خطأ: " + error.message;
                    }
                });
            }).catch(function(err) {
                status.innerText = "يرجى الفتح من داخل Pi Browser";
            });
        };
    </script>
</body>
</html>
