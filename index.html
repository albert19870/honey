<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="text-align: center; padding-top: 50px; font-family: Arial;">
    <h1 style="color: #673ab7;">تطبيق Honey - Testnet</h1>
    <p>بانتظار إتمام 10 عمليات دفع لتفعيل الماينت</p>
    
    <button id="btn-pay" style="padding: 20px; background: #673ab7; color: white; border-radius: 10px; font-size: 20px; cursor: pointer;">
        دفع 0.1 Pi (تيست نت)
    </button>
    
    <p id="msg" style="margin-top: 20px; font-weight: bold;"></p>

    <script>
        const Pi = window.Pi;
        // تفعيل التيست نت وربطه بمفتاح التطبيق الخاص بك
        Pi.init({ version: "2.0", sandbox: true });

        document.getElementById('btn-pay').onclick = function() {
            const msgElement = document.getElementById('msg');
            msgElement.innerText = "جاري الاتصال بالمحفظة...";

            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "Testnet Step 10",
                    metadata: { orderId: "order_" + Date.now() }
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        // استخدام الـ API Key الذي حصلت عليه برمجياً
                        console.log("Payment ID: ", paymentId);
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        msgElement.style.color = "green";
                        msgElement.innerText = "نجحت العملية! التكس: " + txid;
                        alert("تمت العملية بنجاح! كررها لـ 10 أشخاص");
                    },
                    onCancel: function(paymentId) { msgElement.innerText = "تم الإلغاء"; },
                    onError: function(error) { 
                        alert("خطأ: " + error.message);
                        msgElement.innerText = "خطأ: " + error.message;
                    }
                });
            });
        };
    </script>
</body>
</html>
