<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey App - Mainnet</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background-color: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;">
        <h1 style="color: #673ab7;">تطبيق Honey</h1>
        <p style="color: #666;">اضغط على الزر أدناه لتفعيل التطبيق وإتمام العملية النهائية.</p>
        
        <button id="main-button" style="background-color: #673ab7; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; transition: background 0.3s;">
            تفعيل ودفع 0.1 Pi
        </button>
    </div>

    <script>
        const Pi = window.Pi;
        // تفعيل وضع الماينت: sandbox false
        Pi.init({ version: "2.0", sandbox: false });

        document.getElementById('main-button').addEventListener('click', function() {
            // طلب الإذن والموافقة على الدفع
            Pi.authenticate(['payments']).then(function(auth) {
                console.log("تم تسجيل الدخول بنجاح");
                
                Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق Honey - الماينت",
                    metadata: { orderId: "Order_ID_" + Date.now() }, // توليد رقم طلب جديد تلقائياً
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        // في هذه المرحلة، نظام Pi ينتظر الموافقة. 
                        // بما أننا في مرحلة الاختبار، ستنتظر ظهور نافذة المحفظة.
                        console.log("Payment Created. ID: " + paymentId);
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        // هذه الوظيفة تعمل بعد أن ينهي السيرفر (أو النظام) المعاملة
                        alert("تمت المعاملة بنجاح! رقم المعاملة: " + txid);
                        location.reload(); // إعادة تحميل الصفحة لتحديث الحالة
                    },
                    onCancel: function(paymentId) {
                        console.log("تم إلغاء العملية");
                    },
                    onError: function(error, payment) {
                        console.error("خطأ في العملية:", error);
                        alert("حدث خطأ. يرجى المحاولة من داخل متصفح Pi.");
                    },
                });
            }).catch(function(error) {
                console.error(error);
                alert("يجب فتح التطبيق من داخل Pi Browser");
            });
        });
    </script>
</body>
</html>
