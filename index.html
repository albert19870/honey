<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HoneyGold - Pi Network</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/0.21.1/axios.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #f0f2f5; padding: 40px 20px; color: #333; }
        .container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 450px; margin: auto; }
        .logo { width: 120px; height: 120px; border-radius: 50%; border: 4px solid #6d28d9; margin-bottom: 20px; }
        h1 { color: #6d28d9; margin-bottom: 10px; }
        p { color: #666; line-height: 1.6; }
        .btn-pay { background: #6d28d9; color: white; border: none; padding: 18px 35px; border-radius: 12px; font-size: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; width: 100%; margin-top: 20px; }
        .btn-pay:hover { background: #5b21b6; transform: translateY(-2px); }
        #status-msg { margin-top: 25px; padding: 15px; border-radius: 10px; font-weight: bold; display: none; }
        .loading { color: #856404; background: #fff3cd; }
        .success { color: #155724; background: #d4edda; }
        .error { color: #721c24; background: #f8d7da; }
    </style>
</head>
<body>

    <div class="container">
        <img src="https://honey-ar2.pages.dev/1753631675212.jpg" alt="HoneyGold" class="logo">
        <h1>HoneyGold</h1>
        <p>مرحباً بك في تطبيق العسل الذهبي.<br>أكمل عملية الدفع التجريبية لتفعيل التطبيق.</p>
        
        <button id="pay-button" class="btn-pay" onclick="startPiPayment()">دفع 0.1 Pi (Testnet)</button>
        
        <div id="status-msg"></div>
    </div>

    <script>
        // تشغيل الـ SDK بنسخة محدثة 1.7
        const Pi = window.Pi;
        Pi.init({ version: "1.7", sandbox: true });

        async function startPiPayment() {
            const statusBox = document.getElementById('status-msg');
            const payButton = document.getElementById('pay-button');

            // إظهار رسالة الحالة
            statusBox.style.display = "block";
            statusBox.className = "loading";
            statusBox.innerText = "جاري فتح محفظة Pi... انتظر قليلاً";
            payButton.disabled = true;

            try {
                const payment = await Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق HoneyGold - Testnet",
                    metadata: { orderId: "HG-" + Date.now() },
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        console.log("Payment Ready for Approval:", paymentId);
                        statusBox.innerText = "جاري تأكيد الدفع من السيرفر...";
                        // الموافقة التلقائية باستخدام الـ API Key الخاص بك
                        return axios.post('https://api.minepi.com/v2/payments/' + paymentId + '/approve', {}, {
                            headers: { 'Authorization': 'Key c2rrejfnw3ycty3qhna6uzwgaefgfm1qhgxpzrigdl2iifremmochsavib0aucv4' }
                        });
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        console.log("Payment Ready for Completion:", paymentId);
                        statusBox.className = "success";
                        statusBox.innerText = "مبروك! تم الدفع بنجاح. رقم العملية: " + txid;
                        return axios.post('https://api.minepi.com/v2/payments/' + paymentId + '/complete', { txid }, {
                            headers: { 'Authorization': 'Key c2rrejfnw3ycty3qhna6uzwgaefgfm1qhgxpzrigdl2iifremmochsavib0aucv4' }
                        });
                    },
                    onCancel: function(paymentId) {
                        statusBox.className = "error";
                        statusBox.innerText = "تم إلغاء عملية الدفع.";
                        payButton.disabled = false;
                    },
                    onError: function(error, payment) {
                        statusBox.className = "error";
                        statusBox.innerText = "حدث خطأ: " + error.message;
                        payButton.disabled = false;
                    }
                });
            } catch (err) {
                statusBox.className = "error";
                statusBox.innerText = "فشل الاتصال بالمحفظة. تأكد من فتح تطبيق Pi Browser مجدداً.";
                payButton.disabled = false;
            }
        }
    </script>
</body>
</html>
