<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Honey App - Mainnet Activation</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0;">

    <div style="background-color: white; padding: 40px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; width: 90%;">
        <h1 style="color: #673ab7;">تطبيق Honey</h1>
        <p style="color: #666;">اضغط أدناه لإتمام الخطوة رقم 10 وتفعيل التطبيق على الشبكة الحقيقية.</p>
        
        <button id="main-button" style="background-color: #673ab7; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; cursor: pointer; font-weight: bold; width: 100%;">
            تفعيل ودفع 0.1 Pi
        </button>
        <p id="status-text" style="margin-top: 20px; font-size: 14px; color: #333;"></p>
    </div>

    <script>
        const Pi = window.Pi;
        // تفعيل وضع الماينت (sandbox: false)
        Pi.init({ version: "2.0", sandbox: false });

        document.getElementById('main-button').addEventListener('click', function() {
            const status = document.getElementById('status-text');
            status.innerText = "جاري الاتصال بالمحفظة...";

            Pi.authenticate(['payments']).then(function(auth) {
                Pi.createPayment({
                    amount: 0.1,
                    memo: "تفعيل تطبيق Honey النهائي",
                    metadata: { 
                        orderId: "Honey_Activation_" + Date.now(),
                        // المفتاح الجديد الذي استخرجته من لوحة المطورين
                        apiKey: "nuwqdjjpr3sao9phuwrbe2skejhhrvcngoa9" 
                    },
                }, {
                    onReadyForServerApproval: function(paymentId) {
                        status.style.color = "blue";
                        status.innerText = "ينتظر موافقتك.. افتح نافذة الدفع الآن!";
                    },
                    onReadyForServerCompletion: function(paymentId, txid) {
                        status.style.color = "green";
                        status.innerText = "تمت المعاملة بنجاح! رقم المعاملة: " + txid;
                        alert("مبروك! الخطوة 10 اكتملت.");
                    },
                    onCancel: function(paymentId) {
                        status.style.color = "orange";
                        status.innerText = "تم إلغاء العملية من قبل المستخدم.";
                    },
                    onError: function(error, payment) {
                        status.style.color = "red";
                        status.innerText = "خطأ: " + error.message;
                    },
                });
            }).catch(function(error) {
                status.innerText = "يجب فتح الرابط من داخل Pi Browser فقط.";
            });
        });
    </script>
</body>
</html>
